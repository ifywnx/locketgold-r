name: Admin dashboard build and safety checks
on:
  push:
    branches:
      - feat/an-store-admin-dashboard-20261023
      - fix/admin-mobile-orders-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: Website bán hàng
    env:
      DATABASE_URL: file:./data/admin-qa.db
      DATA_DIR: ./data
      ADMIN_PASSWORD: integration-only-strong-credential-2026
      STORE_PAYMENTS_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Website bán hàng/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript + Next.js production build
        run: npm run build
      - name: Prepare isolated fixture database
        run: |
          node scripts/init-db.mjs
          node --input-type=module <<'NODE'
          import {createClient} from '@libsql/client';
          const db=createClient({url:process.env.DATABASE_URL});
          const now=Date.now();
          const fixture=[
            [5001,'["trend","genz"]',58000,'demo','DEMO_COMPLETED',null],
            [5002,'["premium"]',39000,'live','PAID_AWAITING_DELIVERY',now],
            [5003,'["daily"]',19000,'live','PENDING',null]
          ];
          for(const [id,items,amount,mode,status,paid] of fixture){
            await db.execute({sql:'INSERT INTO store_orders (id, owner_hash, items_json, amount, mode, status, created, paid) VALUES (?, ?, ?, ?, ?, ?, ?, ?)',
              args:[id,'test-owner-'+id,items,amount,mode,status,now,paid]});
          }
          db.close();
          NODE
      - name: Start application in isolated demo mode
        run: |
          npm start > /tmp/an-store-admin-qa.log 2>&1 &
          echo $! > /tmp/an-store-admin-qa.pid
          for n in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/an-store-admin-qa.log
          exit 1
      - name: Check admin isolation, data and demo-only revenue
        run: |
          python3 - <<'PY'
          import base64,json,urllib.request,urllib.error
          origin='http://127.0.0.1:3000'
          route='/api/admin/store?days=30'
          try:
              urllib.request.urlopen(origin+route)
              raise AssertionError('Unauthenticated admin analytics were exposed')
          except urllib.error.HTTPError as error:
              assert error.code==401,error.code
          basic=base64.b64encode(b'admin:integration-only-strong-credential-2026').decode()
          def read(path):
              request=urllib.request.Request(origin+path,headers={'Authorization':'Basic '+basic})
              with urllib.request.urlopen(request) as response:
                  assert response.status==200
                  assert 'no-store' in response.headers.get('Cache-Control','')
                  return json.load(response)
          report=read(route)
          assert report['storeMode']=='demo',report['storeMode']
          assert report['readonly'] is True
          m=report['metrics']
          assert m['demoOrders']==1,m
          assert m['liveOrders']==2,m
          assert m['verifiedLiveOrders']==1,m
          assert m['verifiedRevenue']==39000,m
          assert m['eligibleForFiles']==2,m
          assert m['awaitingPayment']==1,m
          assert report['pagination']['total']==3,report['pagination']
          assert all('ownerHash' not in row and 'checkoutUrl' not in row and 'paymentAccount' not in row for row in report['orders'])
          assert read(route+'&mode=demo')['pagination']['total']==1
          assert read(route+'&mode=live&status=PENDING')['pagination']['total']==1
          found=read(route+'&search=5002')
          assert len(found['orders'])==1 and found['orders'][0]['id']==5002
          assert len(report['trend'])==30,len(report['trend'])
          assert any(p['id']=='trend' and p['demo']==1 for p in report['productPopularity'])
          print('PASS authentication / no-store / 0 VND demo isolation / verified revenue / paging / filters / popularity')
          PY
      - name: Install browser automation
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Test desktop and iPhone-size admin dashboard
        run: python3 qa/admin_smoke.py
      - name: Upload dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: an-store-admin-preview
          path: Website bán hàng/qa/artifacts/
          retention-days: 3
          if-no-files-found: ignore
      - name: Show logs if tests fail
        if: failure()
        run: tail -80 /tmp/an-store-admin-qa.log || true

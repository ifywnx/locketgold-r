name: An Store browser smoke (manual QA branch)
on:
  push:
    branches: [qa-browser-smoke-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test live production interface (0 VND demo only)
        run: python qa/browser_smoke.py
        env:
          BASE_URL: https://an-store-production.up.railway.app
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: an-store-ui-smoke
          path: qa/screenshots/
          if-no-files-found: ignore
          retention-days: 3

name: AN Moments iOS (unsigned app + widget builds)

on:
  pull_request:
    paths:
      - 'ios/ANMoments/**'
      - '.github/workflows/an-moments-ios.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Build app target without signing
        run: zsh ios/ANMoments/TEST_ON_MAC.command
      - name: Build app and WidgetKit extension without signing
        run: zsh ios/ANMoments/TEST_WITH_WIDGET.command

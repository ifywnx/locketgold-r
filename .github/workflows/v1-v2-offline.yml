name: V1 V2 offline comparison
on:
  push:
    branches: [qa-v1-v2-offline-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run local comparison using mock responses only
        run: node qa/compare-v1-v2.cjs
      - name: Attach report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-v2-offline-diff
          path: qa/results/
          if-no-files-found: ignore
          retention-days: 14

name: ANMoments
options:
  bundleIdPrefix: com.ifywnx
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  ANMoments:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: Supabase
        product: Supabase
      - target: ANMomentsWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ifywnx.anmoments
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "AN Moments"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "Chụp khoảnh khắc gửi cho bạn bè."
        NSPhotoLibraryUsageDescription: "Chọn ảnh từ thư viện."
        NSPhotoLibraryAddUsageDescription: "Lưu ảnh vào thư viện."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ifywnx.anmoments
  ANMomentsWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ifywnx.anmoments.widget
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "AN Moments Widget"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ifywnx.anmoments
schemes:
  ANMoments:
    build:
      targets:
        ANMoments: all
        ANMomentsWidget: all
    run:
      config: Debug

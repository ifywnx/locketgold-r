name: ANMoments
options:
  bundleIdPrefix: com.ifywnx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "IconRose IconMidnight"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  ANMoments:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ifywnx.anmoments
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "AN Moments"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "Cho phép thu âm khi quay video khoảnh khắc."
        NSCameraUsageDescription: "AN Moments cần camera để chụp khoảnh khắc bạn gửi cho bạn bè."
        NSPhotoLibraryUsageDescription: "Cho phép chọn ảnh để tạo khoảnh khắc."
        NSPhotoLibraryAddUsageDescription: "Cho phép lưu ảnh khoảnh khắc về thư viện."
        UIUserInterfaceStyle: "Light"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  ANMoments:
    build:
      targets:
        ANMoments: all
    run:
      config: Debug
